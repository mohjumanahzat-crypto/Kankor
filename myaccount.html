<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" id="viewport" content="width=device-width, initial-scale=1">
    <style>
        div {
            box-shadow: 1px 2px 30px 10px black;
            border-radius: 30px;


        }
    </style>
</head>

<body bgcolor="#333333">
    <font color="white">
        <div align="center">
<h1>Your account 💻</h1>
            <h4 id="acc"></h4>
        </div>
    </font>


<script>
var acc=localStorage.getItem("userid");

var data1= new FormData();
data1.append("id",acc);

fetch("myaccount.php", {
      method : "POST" ,
      body : data1

}).then(res => res.text()).
then(data=> {
document.getElementById("acc").innerHTML=data;
});

</script>
</body>

</html>
